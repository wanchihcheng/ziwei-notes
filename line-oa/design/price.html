<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>價目表</title>
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@300;400;500;700;900&family=Bodoni+Moda:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 字體沿用主宣傳圖：中文昭源宋體，英文 Bodoni Moda
   字級：標題 64 ／ 價格 78 ／ 服務名稱 40 ／ 項目 24 ／ 說明・底部 22 ／ 小標 18 */
.canvas{width:1080px;height:1350px;font-family:'Bodoni Moda','Chiron Sung HK',serif}
.canvas .vane-branch{font-family:'Chiron Sung HK',serif}
.canvas .compass-labels text{font-family:'Bodoni Moda',serif;font-weight:600;font-size:15px}
.head{position:absolute;top:80px;left:0;right:0;text-align:center}
.icon{width:170px;height:204px;margin:0 auto 6px}
.head h1{font-weight:900;font-size:64px;letter-spacing:.3em;padding-left:.3em}
.badge{display:inline-block;margin-top:18px;padding:8px 22px;border:1px solid rgba(227,191,115,.55);
  font-size:22px;font-weight:500;letter-spacing:.2em;color:var(--gold)}
.card{position:absolute;left:110px;right:110px;top:515px;padding:46px 56px 42px;
  border:1px solid rgba(227,191,115,.45);background:linear-gradient(160deg,rgba(139,108,255,.14),rgba(20,15,42,.55) 60%);
  box-shadow:0 0 60px rgba(139,108,255,.18) inset}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:3px;background:var(--gold)}
.svc{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.svc h2{font-size:40px;font-weight:700;letter-spacing:.12em;line-height:1.35}
.svc h2 small{display:block;font-size:22px;font-weight:400;letter-spacing:.3em;color:var(--violet-lt);margin-bottom:6px}
.price{text-align:right;white-space:nowrap}
.price .dur{font-size:22px;font-weight:500;letter-spacing:.2em;color:var(--ink-mid)}
.price .amt{font-weight:600;font-size:78px;line-height:1.05}
.price .amt em{font-style:normal;font-size:28px;margin-right:8px;letter-spacing:.08em}
.divider{height:1px;background:linear-gradient(90deg,var(--gold),rgba(227,191,115,0));margin:32px 0 26px;opacity:.6}
ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px 30px}
li{font-size:24px;letter-spacing:.1em;color:var(--ink);display:flex;gap:14px;align-items:baseline}
li::before{content:"";flex:none;width:8px;height:8px;transform:rotate(45deg) translateY(-3px);background:var(--gold)}
li.full{grid-column:1/-1}
.notes{position:absolute;left:110px;right:110px;top:985px}
.notes h3{font-size:18px;font-weight:500;letter-spacing:.4em;color:var(--violet-lt);margin-bottom:14px}
.notes p{font-size:22px;line-height:1.9;color:var(--ink-mid);letter-spacing:.06em}
.notes b{color:var(--gold);font-weight:500}
.foot{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;align-items:baseline}
.foot div{font-size:22px;font-weight:500;letter-spacing:.2em;color:var(--gold)}
</style></head>
<body>
<div class="canvas">
  <div class="stars" style="position:absolute;inset:0" data-seed="23" data-dipper="0"></div>
  <div class="frame"></div>
  <div class="head">
    <div class="icon" data-vane="classic"></div>
    <h1 class="gold-text">價目表</h1>
    <div class="badge">真人一對一・非 AI 解讀</div>
  </div>
  <div class="card">
    <div class="svc">
      <h2><small>欽天門紫微斗數</small>一對一線上解盤</h2>
      <div class="price"><div class="dur">60 MIN</div><div class="amt gold-text"><em>NT$</em>3,000</div></div>
    </div>
    <div class="divider"></div>
    <ul>
      <li>事業方向與財運</li>
      <li>感情與人際關係</li>
      <li>今年流年運勢</li>
      <li>健康</li>
      <li class="full">你最在意的那件事</li>
    </ul>
  </div>
  <div class="notes">
    <h3>預約須知</h3>
    <p>・採預約制，請透過 <b>LINE</b> 私訊預約時段<br>
       ・請提供：<b>國曆生日、出生時間、性別、出生地</b><br>
       ・全程<b>線上視訊</b>進行｜改期請於 24 小時前告知</p>
  </div>
  <div class="foot"><div>愛瑞卡 Erica</div><div>LINE 預約・歡迎聊聊</div></div>
</div>
<script src="stars.js"></script><script src="vane.js"></script>
</body></html>
