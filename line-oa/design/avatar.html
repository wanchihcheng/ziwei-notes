<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>LINE 大頭貼</title>
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400&family=Bodoni+Moda:wght@600&display=swap" rel="stylesheet">
<style>
/* 與主宣傳圖同一個風向標（classic），LINE 會裁成圓形，地支環中心對齊畫布中心 */
.canvas{width:640px;height:640px;background:radial-gradient(circle at 50% 48%,#2a1f63 0%,#140f33 55%,#0b0918 100%)}
.canvas::before{display:none}
.canvas .vane-branch{font-family:'Chiron Sung HK',serif}
.canvas .compass-labels text{font-family:'Bodoni Moda',serif;font-weight:600;font-size:15px}
.vane{position:absolute;left:50%;top:40px;width:560px;height:672px;transform:translateX(-50%)}
</style></head>
<body>
<div class="canvas">
  <div class="vane" data-vane="classic"></div>
</div>
<script src="vane.js"></script>
</body></html>
