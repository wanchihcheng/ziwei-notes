<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>宣傳海報</title>
<link rel="stylesheet" href="common.css">
<style>
.canvas{width:1080px;height:1350px}
.top{position:absolute;top:86px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;
  font-family:'Noto Serif TC',serif;font-size:22px;letter-spacing:.5em;color:var(--violet-lt)}
.top::before,.top::after{content:"";width:56px;height:1px;background:var(--gold);opacity:.6}
.top span{padding-left:.5em}
.vane{position:absolute;left:50%;top:170px;width:640px;height:768px;transform:translateX(-50%)}
.copy{position:absolute;left:0;right:0;top:930px;text-align:center}
.headline{font-family:'Noto Serif TC',serif;font-weight:900;font-size:76px;letter-spacing:.1em;line-height:1.2;padding-left:.1em}
.gap{display:inline-block;width:.45em}
.sub{margin-top:22px;font-size:25px;letter-spacing:.28em;color:var(--ink-mid);font-weight:300;padding-left:.28em}
.name{margin-top:46px;display:inline-flex;align-items:center;gap:26px;font-family:'Noto Serif TC',serif}
.name b{font-size:44px;font-weight:700;letter-spacing:.16em}
.name em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:44px;letter-spacing:.04em;color:var(--gold);margin-left:-8px}
.name i{font-style:normal;width:1px;height:38px;background:var(--gold);opacity:.6}
.name span{font-size:24px;letter-spacing:.3em;color:var(--violet-lt)}
.foot{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;align-items:flex-end;
  font-family:'Noto Sans TC',sans-serif;font-size:22px;letter-spacing:.2em;font-weight:500}
.foot .real{color:var(--ink);display:flex;align-items:center;gap:12px}
.foot .real::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--gold)}
.foot .cta{color:var(--gold)}
</style></head>
<body>
<div class="canvas">
  <div class="stars" style="position:absolute;inset:0" data-seed="11" data-dipper="0"></div>
  <div class="frame"></div>
  <div class="top"><span>欽天門・紫微斗數</span></div>
  <div class="vane" data-vane="classic"></div>
  <div class="copy">
    <div class="headline gold-text">岔路口<span class="gap"></span>陪你看風向</div>
    <div class="sub">命盤給你一點方向・選擇永遠在你</div>
    <div class="name"><b>愛瑞卡</b><em>Erica</em><i></i><span>紫微斗數命理師</span></div>
  </div>
  <div class="foot"><div class="real">真人一對一解盤</div><div class="cta">LINE 預約・歡迎聊聊</div></div>
</div>
<script src="stars.js"></script><script src="vane.js"></script>
</body></html>
