<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>宣傳海報</title>
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@300;400;500;700;900&family=Bodoni+Moda:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 字體：中文一律昭源宋體（Chiron Sung HK），英文一律 Bodoni Moda
   字級：標題 84 ／ 名字 44 ／ 副標・頭銜 26 ／ 底部 22 ／ 圓盤標示 15 */
.canvas{width:1080px;height:1350px;font-family:'Bodoni Moda','Chiron Sung HK',serif}
.canvas .vane-branch{font-family:'Chiron Sung HK',serif}
.canvas .compass-labels text{font-family:'Bodoni Moda',serif;font-weight:600;font-size:15px}
.vane{position:absolute;left:50%;top:170px;width:640px;height:768px;transform:translateX(-50%)}
.copy{position:absolute;left:0;right:0;top:930px;text-align:center}
.headline{font-weight:900;font-size:84px;letter-spacing:.14em;line-height:1.2;padding-left:.14em}
.sub{margin-top:22px;font-size:26px;font-weight:400;letter-spacing:.28em;padding-left:.28em;color:var(--ink-mid)}
.name{margin-top:46px;display:inline-flex;align-items:center;gap:26px}
.name b,.name em{font-size:44px;font-weight:700;color:var(--ink)}
.name b{letter-spacing:.16em}
.name em{font-style:normal;font-weight:600;letter-spacing:.02em;margin-left:-8px}
.name i{width:1px;height:38px;background:var(--gold);opacity:.6}
.name span{font-size:26px;font-weight:400;letter-spacing:.3em;color:var(--violet-lt)}
.foot{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;align-items:baseline}
.foot div{font-size:22px;font-weight:500;letter-spacing:.2em;color:var(--gold)}
</style></head>
<body>
<div class="canvas">
  <div class="stars" style="position:absolute;inset:0" data-seed="11" data-dipper="0"></div>
  <div class="frame"></div>
  <div class="vane" data-vane="classic"></div>
  <div class="copy">
    <div class="headline gold-text">洞察命運風向</div>
    <div class="sub">陪你走過每個岔路口</div>
    <div class="name"><b>愛瑞卡</b><em>Erica</em><i></i><span>欽天門紫微斗數命理師</span></div>
  </div>
  <div class="foot"><div class="real">真人一對一解盤</div><div class="cta">LINE 預約・歡迎聊聊</div></div>
</div>
<script src="stars.js"></script><script src="vane.js"></script>
</body></html>
